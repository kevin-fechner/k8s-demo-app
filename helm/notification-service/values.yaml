replicaCount: 1

image:
  repository: ghcr.io/kevin-fechner/k8s-demo-app/notification-service
  pullPolicy: IfNotPresent
  tag: "sha-a88ecd2"

service:
  type: ClusterIP
  port: 8083

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

env:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  MAIL_HOST: mailhog.mailhog.svc.cluster.local
  MAIL_PORT: "1025"
  SPRING_PROFILES_ACTIVE: kubernetes