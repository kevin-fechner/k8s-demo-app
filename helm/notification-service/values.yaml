replicaCount: 2

image:
  repository: ghcr.io/kevin-fechner/k8s-demo-app/notification-service
  pullPolicy: IfNotPresent
  tag: "sha-be8e23e"

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

env:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  MAIL_HOST: mailhog.mailhog.svc.cluster.local
  MAIL_PORT: "1025"
  SPRING_PROFILES_ACTIVE: kubernetes
  DB_HOST: notifications-db-rw.databases.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: notificationsdb

db:
  password: "apppassword"