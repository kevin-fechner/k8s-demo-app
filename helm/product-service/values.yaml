replicaCount: 2

image:
  repository: ghcr.io/kevin-fechner/k8s-demo-app/product-service
  pullPolicy: IfNotPresent
  tag: "sha-bb4e92d"

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  DB_HOST: "products-db-rw.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "productsdb"

secret:
  DB_USER: "appuser"
  DB_PASSWORD: "apppassword"

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 60
  periodSeconds: 30