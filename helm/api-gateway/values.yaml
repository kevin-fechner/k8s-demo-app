replicaCount: 2

image:
  repository: ghcr.io/kevin-fechner/k8s-demo-app/api-gateway
  pullPolicy: IfNotPresent
  tag: "sha-e4e6251"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  PRODUCT_SERVICE_URL: "http://product-service.demo-app.svc.cluster.local"
  ORDER_SERVICE_URL: "http://order-service.demo-app.svc.cluster.local"

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 40
  periodSeconds: 30