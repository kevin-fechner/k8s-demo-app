spring:
  application:
    name: api-gateway

  cloud:
    refresh:
      enabled: false
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**

            # ─── Actuator routes ──────────────────────────────────
            - id: product-service-actuator
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/product-service/actuator/**
              filters:
                - StripPrefix=2

            - id: order-service-actuator
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/order-service/actuator/**
              filters:
                - StripPrefix=2

            - id: notification-service-actuator
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/notification-service/actuator/**
              filters:
                - StripPrefix=2

            - id: api-gateway-actuator
              uri: http://localhost:8080
              predicates:
                - Path=/api/gateway/actuator/**
              filters:
                - StripPrefix=2

            # ─── OpenAPI / Swagger routes ──────────────────────────
            - id: order-service-swagger
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/order-service/swagger-ui.html,/api/order-service/swagger-ui/**,/api/order-service/api-docs/**,/api/order-service/webjars/**
              filters:
                - StripPrefix=2

            - id: product-service-swagger
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/product-service/swagger-ui.html,/api/product-service/swagger-ui/**,/api/product-service/api-docs/**,/api/product-service/webjars/**
              filters:
                - StripPrefix=2

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "http://frontend.local"
                  - "http://demo-app.local"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          default-filters:
            - AddResponseHeader=X-Gateway, api-gateway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true

  health:
    kafka:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        enabled: false

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.demo: INFO