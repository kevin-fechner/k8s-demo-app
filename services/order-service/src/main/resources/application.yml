spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ordersdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: order-service

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

kafka:
  topics:
    order-events: order-events
    inventory-events: inventory-events

resilience4j:
  circuitbreaker:
    instances:
      product-service:
        # How many calls to track in the sliding window
        sliding-window-size: 10
        # How many calls must complete before evaluating
        minimum-number-of-calls: 5
        # Open circuit if 50%+ of calls fail
        failure-rate-threshold: 50
        # How long to wait before trying again (HALF-OPEN)
        wait-duration-in-open-state: 10s
        # How many calls to allow in HALF-OPEN state
        permitted-number-of-calls-in-half-open-state: 3
        # Also open on slow calls
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        # What exceptions count as failures
        record-exceptions:
          - java.lang.Exception
        # Register health indicator
        register-health-indicator: true
  timelimiter:
    instances:
      product-service:
        # Timeout for each call
        timeout-duration: 3s

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true

  health:
    kafka:
      enabled: true
    circuitbreakers:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        enabled: false

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

logging:
  level:
    com.demo: INFO

clients:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /api/order-service/api-docs/swagger-config
    url: /api/order-service/api-docs
  show-actuator: false