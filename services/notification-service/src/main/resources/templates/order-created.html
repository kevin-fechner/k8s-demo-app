<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 15px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #f2f2f2; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        .total { font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Order Confirmation</h2>
    </div>
    <p>Hi <span th:text="${customerName}">Customer</span>,</p>
    <p>Thank you for your order! Here's a summary:</p>
    <p><strong>Order ID:</strong> <span th:text="${orderId}"/></p>

    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Unit Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.productName()}">Product</td>
            <td th:text="${item.quantity()}">1</td>
            <td th:text="${'€' + item.unitPrice()}">0.00</td>
        </tr>
        </tbody>
    </table>

    <p class="total">Total: €<span th:text="${totalAmount}"/></p>
    <p>We'll notify you when your order ships.</p>
</div>
</body>
</html>
