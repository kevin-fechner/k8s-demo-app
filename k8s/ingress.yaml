apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-ingress
  namespace: demo-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  - host: demo-app.local
    http:
      paths:
      # API gateway handles all /api/* traffic
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      # Frontend serves everything else
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4000