name: API Gateway CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/api-gateway/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k8s-demo-app/api-gateway
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test & SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests with coverage
        working-directory: services/api-gateway
        run: mvn clean verify -B

      - name: SonarQube Analysis
        working-directory: services/api-gateway
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GATEWAY }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=kevin-fechner_api-gateway \
            -Dsonar.projectName="API Gateway" \
            -Dsonar.organization=kevin-fechner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -B

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update Image Tag
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Update Helm values with new image tag
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|tag: .*|tag: \"${SHA_TAG}\"|" \
            helm/api-gateway/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/api-gateway/values.yaml
          git commit -m "ci: update api-gateway image to sha-$(echo ${{ github.sha }} | cut -c1-7) [skip ci]"
          git push