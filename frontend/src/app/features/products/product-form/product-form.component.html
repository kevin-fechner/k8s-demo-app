<div class="overlay" (click)="cancelled.emit()">
  <div class="modal" (click)="$event.stopPropagation()"
       role="dialog"
       [attr.aria-label]="product() ? 'Edit Product' : 'Add Product'">
    <h2>{{ product() ? 'Edit Product' : 'Add Product' }}</h2>

    @if (store.error()) {
      <div class="error" role="alert">{{ store.error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="name">Name *</label>
        <input id="name" formControlName="name"
               placeholder="Product name"
               [attr.aria-invalid]="form.get('name')?.invalid && form.get('name')?.touched" />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <span class="field-error" role="alert">Name is required</span>
        }
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="price">Price *</label>
          <input id="price" formControlName="price"
                 type="number" step="0.01" min="0.01" />
          @if (form.get('price')?.invalid && form.get('price')?.touched) {
            <span class="field-error" role="alert">Valid price required</span>
          }
        </div>
        <div class="form-group">
          <label for="stock">Stock *</label>
          <input id="stock" formControlName="stock"
                 type="number" min="0" />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel"
                (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-save"
                [disabled]="store.loading() || form.invalid">
          {{ store.loading() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
