<button
  class="overlay"
  tabindex="0"
  (click)="cancelled.emit()"
  (keydown.enter)="cancelled.emit()"
  (keydown.space)="cancelled.emit()">
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
  <dialog class="modal" aria-label="New Order" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <h2>New Order</h2>

    @if (orderStore.error()) {
      <div class="error" role="alert">{{ orderStore.error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="customerName">Customer Name *</label>
        <input id="customerName" formControlName="customerName" placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="customerEmail">Customer Email *</label>
        <input id="customerEmail" formControlName="customerEmail" type="email" placeholder="john@example.com" />
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" formControlName="notes" rows="2"></textarea>
      </div>

      <h3>Items</h3>
      <div formArrayName="items">
        @for (item of itemsArray.controls; track $index) {
          <div class="item-row" [formGroupName]="$index">
            <label [for]="'product-' + $index" class="sr-only"> Product for item {{ $index + 1 }} </label>
            <select [id]="'product-' + $index" formControlName="productId">
              <option value="">Select product...</option>
              @for (p of productStore.products(); track p.id) {
                <option [value]="p.id">{{ p.name }} ({{ p.price | currency }})</option>
              }
            </select>
            <label [for]="'qty-' + $index" class="sr-only"> Quantity for item {{ $index + 1 }} </label>
            <input [id]="'qty-' + $index" formControlName="quantity" type="number" min="1" />
            <button
              type="button"
              class="btn-remove"
              [attr.aria-label]="'Remove item ' + ($index + 1)"
              (click)="removeItem($index)">
              ✕
            </button>
          </div>
        }
      </div>

      <button type="button" class="btn-add-item" (click)="addItem()">+ Add Item</button>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="orderStore.loading() || form.invalid">
          {{ orderStore.loading() ? 'Saving...' : 'Place Order' }}
        </button>
      </div>
    </form>
  </dialog>
</button>
